name: Deploy to local microk8s

on:
  push:
    branches:
      - master

# Only one deploy at a time. If a new push arrives while a deploy is running,
# cancel the in-progress run and start fresh with the latest code.
concurrency:
  group: deploy-local
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # pin to the exact commit that triggered this run
          clean: true              # wipe any leftover files from previous runs

      # Copy local config files from their stable location outside the repo.
      # Neither file is committed — they live only on this machine.
      - name: Restore secrets and configmap
        run: |
          cp ~/.scim-dev/.env.k8s.local .env.k8s.local
          cp ~/.scim-dev/configmap.yaml  k8s/configmap.yaml

      # Build the Docker image and import it into microk8s containerd.
      - name: Build image
        run: make image-build

      # Apply secrets + configmap check + kubectl apply + rollout wait.
      - name: Deploy
        run: make deploy
