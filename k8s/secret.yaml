# ── scim-dev-server secrets ───────────────────────────────────────────────────
# Fill in every REPLACE_ME value before running `make deploy`.
# stringData values are plain-text — kubectl base64-encodes them automatically.
# Do NOT commit a filled-in copy of this file.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: scim-dev-secrets
  namespace: scim-dev
type: Opaque
stringData:
  # NextAuth signing secret — any long random string, e.g. `openssl rand -hex 32`
  NEXTAUTH_SECRET: "REPLACE_ME"

  # Okta OAuth app client secret
  OKTA_CLIENT_SECRET: "REPLACE_ME"

  # Native PostgreSQL connection string (external host)
  # Example: postgresql://postgres:password@host.minikube.internal:5432/scim_dev
  POSTGRES_URL: "REPLACE_ME"

  # Cloudflare Tunnel token (from Zero Trust → Tunnels → <your tunnel> → Configure → Token)
  CF_TUNNEL_TOKEN: "REPLACE_ME"

  # LLM API key used by the AI suggestion endpoints
  LLM_API_KEY: "REPLACE_ME"
