# ── REFERENCE ONLY — this file is NOT applied to the cluster ─────────────────
#
# Secrets are managed via:
#   cp k8s/env.template .env.k8s.local   # once
#   <fill in .env.k8s.local>
#   make secrets                          # creates/updates the k8s Secret
#
# The keys below document what the Secret must contain.
# See k8s/env.template for the canonical value template.
# ─────────────────────────────────────────────────────────────────────────────
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: scim-dev-secrets
#   namespace: scim-dev
# type: Opaque
# stringData:
#   NEXTAUTH_SECRET:    "<openssl rand -hex 32>"
#   OKTA_CLIENT_SECRET: "<Okta app client secret>"
#   POSTGRES_PASSWORD:  "<chosen password>"
#   POSTGRES_URL:       "postgresql://postgres:<password>@postgres:5432/scim_dev"
#   CF_TUNNEL_TOKEN:    "<Cloudflare Zero Trust tunnel token>"
#   LLM_API_KEY:        "<LLM API key>"
