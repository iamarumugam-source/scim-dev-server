apiVersion: apps/v1
kind: Deployment
metadata:
  name: scim-dev
  namespace: scim-dev
  labels:
    app: scim-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scim-dev
  template:
    metadata:
      labels:
        app: scim-dev
    spec:
      # ── init: wait for postgres before starting the app ───────────────────────
      # Loops until the postgres Service's port 5432 is accepting connections.
      # Prevents the app from crashing on startup if postgres hasn't finished
      # initialising its data directory yet.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres:5432..."
              until nc -z postgres 5432; do
                sleep 2
              done
              echo "postgres is up."

      # ── app container ────────────────────────────────────────────────────────
      containers:
        - name: app
          # Imported into microk8s containerd with `make image-build`
          # (docker build → docker save → microk8s ctr images import).
          # Never pull from a registry — image lives only in local containerd.
          image: scim-dev-server:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000

          # All ConfigMap keys + all Secret keys injected as env vars.
          # Secret values shadow any same-named ConfigMap key.
          envFrom:
            - configMapRef:
                name: scim-dev-config
            - secretRef:
                name: scim-dev-secrets

          # TCP probe: port open → app is ready. No health endpoint required.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      # ── cloudflared sidecar ──────────────────────────────────────────────────
      # Both containers share the same network namespace. cloudflared reaches
      # the Next.js app at http://localhost:3000 — no intra-cluster Service
      # needed for the tunnel itself.
      #
      # Pre-requisite: in the Cloudflare Zero Trust dashboard the tunnel's
      # public hostname rule must point to:
      #   Service type: HTTP   URL: localhost:3000
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args:
            - tunnel
            - --no-autoupdate
            # metrics server: /ready (tunnel connected) + /metrics (Prometheus)
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scim-dev-secrets
                  key: CF_TUNNEL_TOKEN

          ports:
            - name: metrics
              containerPort: 2000

          # /ready returns 200 once cloudflared has an active tunnel connection.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          # /healthz is a basic alive check (process up, not necessarily connected).
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
